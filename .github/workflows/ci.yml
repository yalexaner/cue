name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SwiftLint
        run: |
          curl -fsSL -o swiftlint_linux.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q swiftlint_linux.zip -d swiftlint-bin
          chmod +x swiftlint-bin/swiftlint
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install just
        run: brew install just

      - name: Build
        run: just build

      - name: Test
        run: just test
