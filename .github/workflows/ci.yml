name: CI
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.0
  JUST_VERSION: 1.57.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard CodeRabbit configuration
        if: github.event_name == 'pull_request'
        env:
          OVERRIDE_LABEL: coderabbit-config-change
        run: |
          set -euo pipefail

          failed=0

          # (a) .coderabbit.yaml must not change inside an ordinary PR.
          touched=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- .coderabbit.yaml)
          if [ -n "$touched" ]; then
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if printf '%s\n' "$labels" | grep -Fxq "$OVERRIDE_LABEL"; then
              echo "note: .coderabbit.yaml is modified, and the '$OVERRIDE_LABEL' label is present — allowed."
            else
              echo "::error file=.coderabbit.yaml::This PR modifies .coderabbit.yaml without the '$OVERRIDE_LABEL' label."
              echo "CodeRabbit reads .coderabbit.yaml from the branch under review, so a PR can weaken"
              echo "the reviewer meant to catch it — a path filter, a deleted path instruction or a"
              echo "flipped switch takes effect on that same PR. That is a config-from-branch integrity"
              echo "hole, and it is why the file is guarded here in .github/workflows (which the"
              echo "CodeRabbit app has no permission to modify)."
              echo "If the change is intended, a human applies the '$OVERRIDE_LABEL' label and re-runs."
              failed=1
            fi
          fi

          # (b) the PR body must not carry a CodeRabbit kill-switch.
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr '[:upper:]' '[:lower:]')
          for phrase in "@coderabbitai ignore" "@coderabbitai pause"; do
            case "$body" in
              *"$phrase"*)
                echo "::error::PR description contains '$phrase', which disables the CodeRabbit review for this PR."
                echo "The reviewer is advisory, but silencing it from inside the PR it is meant to review"
                echo "defeats the point. Remove the directive from the description and re-run."
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CodeRabbit configuration guard: OK"

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        run: |
          curl -fsSL -o just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p just-bin && tar -xzf just.tar.gz -C just-bin just
          echo "$PWD/just-bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint
        run: |
          curl -fsSL -o swiftlint_linux.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q swiftlint_linux.zip -d swiftlint-bin
          chmod +x swiftlint-bin/swiftlint
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install just
        run: brew install just

      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: Format check
        run: just format-check
