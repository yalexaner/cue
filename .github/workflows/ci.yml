name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.0
  JUST_VERSION: 1.57.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        run: |
          curl -fsSL -o just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p just-bin && tar -xzf just.tar.gz -C just-bin just
          echo "$PWD/just-bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint
        run: |
          curl -fsSL -o swiftlint_linux.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q swiftlint_linux.zip -d swiftlint-bin
          chmod +x swiftlint-bin/swiftlint
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install just
        run: brew install just

      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: Format check
        run: just format-check
